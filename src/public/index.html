<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eco-board</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1d2330;
      --muted: #667085;
      --border: #e3e6eb;
      --warn: #b54708;
      /* Chart series colors (validated for color-blind safety on --card) */
      --series-1: #2a78d6;
      --series-2: #eb6834;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111418;
        --card: #1b2027;
        --text: #e6e9ee;
        --muted: #98a2b3;
        --border: #2a313b;
        --warn: #f79009;
        --series-1: #3987e5;
        --series-2: #d95926;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
    header,
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 1.5rem; }
    h2 { margin: 0; font-size: 1.125rem; }
    h3 { margin: 0 0 8px; font-size: 0.875rem; font-weight: 500; color: var(--muted); }
    .meta { margin: 4px 0 0; color: var(--muted); font-size: 0.875rem; }
    .meta.stale { color: var(--warn); }
    button {
      font: inherit;
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: progress; }
    button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
    .ranges { display: flex; gap: 8px; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-top: 24px;
    }
    .card {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
    }
    .label { color: var(--muted); font-size: 0.875rem; }
    .value {
      margin-top: 4px;
      font-size: 2rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .unit { margin-left: 4px; color: var(--muted); font-size: 1rem; font-weight: 400; }
    .error { margin-top: 16px; color: var(--warn); }
    .history { margin-top: 32px; }
    .charts { display: grid; gap: 16px; margin-top: 16px; }
    /* Chart.js fills its parent, so the parent needs a fixed height. */
    .chart-box { position: relative; height: 220px; }

    /* Phones: keep this breakpoint in sync with NARROW_SCREEN in the script. */
    @media (max-width: 600px) {
      .chart-box { height: 180px; }
      .ranges button { padding: 6px 10px; font-size: 0.875rem; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>eco-board</h1>
        <p class="meta" id="status">Loading…</p>
      </div>
      <button id="refresh" type="button">Refresh</button>
    </header>

    <section class="cards">
      <div class="card">
        <div class="label">Battery</div>
        <div class="value"><span id="battery">–</span><span class="unit">%</span></div>
      </div>
      <div class="card">
        <div class="label">Power in</div>
        <div class="value"><span id="power-in">–</span><span class="unit">W</span></div>
      </div>
      <div class="card">
        <div class="label">Power out</div>
        <div class="value"><span id="power-out">–</span><span class="unit">W</span></div>
      </div>
      <div class="card">
        <div class="label">Temperature</div>
        <div class="value"><span id="temperature">–</span><span class="unit">°C</span></div>
      </div>
    </section>

    <p class="error" id="error" hidden></p>

    <section class="history">
      <div class="section-header">
        <h2>History</h2>
        <div class="ranges" role="group" aria-label="Time range">
          <button type="button" data-range="24h" aria-pressed="true">24 hours</button>
          <button type="button" data-range="7d" aria-pressed="false">7 days</button>
          <button type="button" data-range="30d" aria-pressed="false">30 days</button>
        </div>
      </div>
      <div class="charts">
        <div class="card">
          <h3>Battery level</h3>
          <div class="chart-box"><canvas id="chart-battery"></canvas></div>
        </div>
        <div class="card">
          <h3>Power</h3>
          <div class="chart-box"><canvas id="chart-power"></canvas></div>
        </div>
        <div class="card">
          <h3>Temperature</h3>
          <div class="chart-box"><canvas id="chart-temperature"></canvas></div>
        </div>
      </div>
    </section>
  </main>

  <!-- Served by our own server from node_modules (see src/server.js). -->
  <script src="/vendor/chart.js/chart.umd.min.js"></script>
  <script type="module">
    // Data older than this is shown as a warning (the poller runs every 5 minutes).
    const STALE_AFTER_MIN = 15;
    // Same breakpoint as the @media rule in the <style> block.
    const NARROW_SCREEN = window.matchMedia('(max-width: 600px)');

    const el = {
      status: document.getElementById('status'),
      refresh: document.getElementById('refresh'),
      error: document.getElementById('error'),
      battery: document.getElementById('battery'),
      powerIn: document.getElementById('power-in'),
      powerOut: document.getElementById('power-out'),
      temperature: document.getElementById('temperature'),
      rangeButtons: document.querySelectorAll('[data-range]'),
    };

    let currentRange = '24h';
    let lastReadings = [];
    let charts = [];

    // A server error page is HTML, not JSON, so don't let parsing hide the real problem.
    async function getJson(url) {
      const res = await fetch(url);
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error ?? `HTTP ${res.status}`);
      return body;
    }

    function showError(message) {
      el.error.textContent = message;
      el.error.hidden = false;
    }

    function formatAge(minutes) {
      if (minutes < 1) return 'just now';
      if (minutes < 60) return `${minutes} min ago`;
      if (minutes < 24 * 60) return `${Math.round(minutes / 60)} h ago`;
      return `${Math.round(minutes / (24 * 60))} d ago`;
    }

    async function loadLatest() {
      try {
        const body = await getJson('/api/readings/latest');
        el.battery.textContent = body.batteryLevel ?? '–';
        el.powerIn.textContent = body.powerIn ?? '–';
        el.powerOut.textContent = body.powerOut ?? '–';
        el.temperature.textContent = body.temperature ?? '–';

        const ts = new Date(body.ts);
        const ageMin = Math.round((Date.now() - ts) / 60_000);
        el.status.textContent =
          `${body.deviceSn} · updated ${ts.toLocaleString()} (${formatAge(ageMin)})`;
        el.status.classList.toggle('stale', ageMin > STALE_AFTER_MIN);
      } catch (err) {
        showError(`Could not load the latest reading: ${err.message}`);
      }
    }

    // --- Charts ---

    function cssVar(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    // Time labels: hours for the 24h view, dates for the longer ones.
    function formatTick(ms) {
      const date = new Date(ms);
      return currentRange === '24h'
        ? date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        : date.toLocaleDateString([], { day: '2-digit', month: '2-digit' });
    }

    function createChart(canvasId, datasets, { unit, min, max }) {
      return new Chart(document.getElementById(canvasId), {
        type: 'line',
        data: { datasets },
        options: {
          maintainAspectRatio: false,
          animation: false,
          parsing: false, // our data is already in { x, y } form
          // Hovering anywhere shows all series at that time, not only the nearest point.
          interaction: { mode: 'index', intersect: false },
          elements: {
            // Smooth curves that never overshoot the real values (no 101 %, no -3 W).
            line: { borderWidth: 2, cubicInterpolationMode: 'monotone' },
            point: { radius: 0, hoverRadius: 4, hitRadius: 8 },
          },
          scales: {
            x: {
              type: 'linear',
              ticks: {
                callback: formatTick,
                // Fewer time labels on phones, so they don't overlap.
                maxTicksLimit: NARROW_SCREEN.matches ? 4 : 8,
                maxRotation: 0,
              },
              grid: { display: false },
            },
            y: {
              min,
              max,
              ticks: { callback: (value) => `${value} ${unit}`, maxTicksLimit: 5 },
            },
          },
          plugins: {
            // One series needs no legend: the card title already names it.
            legend: {
              display: datasets.length > 1,
              align: 'end',
              labels: { boxWidth: 12, boxHeight: 2 },
            },
            tooltip: {
              callbacks: {
                title: (items) => new Date(items[0].parsed.x).toLocaleString(),
                label: (item) => ` ${item.dataset.label}: ${item.parsed.y} ${unit}`,
              },
            },
          },
        },
      });
    }

    function series(label, color, field) {
      return {
        label,
        borderColor: color,
        backgroundColor: color,
        data: lastReadings.map((r) => ({ x: Date.parse(r.ts), y: r[field] })),
      };
    }

    // Charts are rebuilt from scratch on every change: simple, and fast enough
    // for ~300 points.
    function renderCharts() {
      charts.forEach((chart) => chart.destroy());

      // Chart.js draws on a canvas, which cannot use CSS variables directly.
      Chart.defaults.color = cssVar('--muted');
      Chart.defaults.borderColor = cssVar('--border');
      Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;

      const blue = cssVar('--series-1');
      const orange = cssVar('--series-2');
      charts = [
        createChart('chart-battery', [series('Battery', blue, 'batteryLevel')], {
          unit: '%', min: 0, max: 100,
        }),
        createChart('chart-power', [
          series('Power in', blue, 'powerIn'),
          series('Power out', orange, 'powerOut'),
        ], { unit: 'W', min: 0 }),
        createChart('chart-temperature', [series('Temperature', blue, 'temperature')], {
          unit: '°C',
        }),
      ];
    }

    async function loadHistory() {
      try {
        const body = await getJson(`/api/readings?range=${currentRange}`);
        lastReadings = body.readings;
        renderCharts();
      } catch (err) {
        showError(`Could not load the history: ${err.message}`);
      }
    }

    // --- Wiring ---

    async function refreshAll() {
      el.refresh.disabled = true;
      el.error.hidden = true;
      await Promise.all([loadLatest(), loadHistory()]);
      el.refresh.disabled = false;
    }

    el.refresh.addEventListener('click', refreshAll);

    el.rangeButtons.forEach((button) => {
      button.addEventListener('click', () => {
        currentRange = button.dataset.range;
        el.rangeButtons.forEach((b) => b.setAttribute('aria-pressed', String(b === button)));
        loadHistory();
      });
    });

    // Redraw the charts with the new colors when the system switches light/dark mode.
    window.matchMedia('(prefers-color-scheme: dark)')
      .addEventListener('change', renderCharts);
    // ...and with the right number of time labels when the screen crosses 600 px.
    NARROW_SCREEN.addEventListener('change', renderCharts);

    refreshAll();
  </script>
</body>
</html>
