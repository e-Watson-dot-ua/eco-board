<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eco-board</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1d2330;
      --muted: #667085;
      --border: #e3e6eb;
      --warn: #b54708;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111418;
        --card: #1b2027;
        --text: #e6e9ee;
        --muted: #98a2b3;
        --border: #2a313b;
        --warn: #f79009;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 1.5rem; }
    .meta { margin: 4px 0 0; color: var(--muted); font-size: 0.875rem; }
    .meta.stale { color: var(--warn); }
    button {
      font: inherit;
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: progress; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-top: 24px;
    }
    .card {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
    }
    .label { color: var(--muted); font-size: 0.875rem; }
    .value {
      margin-top: 4px;
      font-size: 2rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .unit { margin-left: 4px; color: var(--muted); font-size: 1rem; font-weight: 400; }
    .error { margin-top: 16px; color: var(--warn); }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>eco-board</h1>
        <p class="meta" id="status">Loading…</p>
      </div>
      <button id="refresh" type="button">Refresh</button>
    </header>

    <section class="cards">
      <div class="card">
        <div class="label">Battery</div>
        <div class="value"><span id="battery">–</span><span class="unit">%</span></div>
      </div>
      <div class="card">
        <div class="label">Power in</div>
        <div class="value"><span id="power-in">–</span><span class="unit">W</span></div>
      </div>
      <div class="card">
        <div class="label">Power out</div>
        <div class="value"><span id="power-out">–</span><span class="unit">W</span></div>
      </div>
      <div class="card">
        <div class="label">Temperature</div>
        <div class="value"><span id="temperature">–</span><span class="unit">°C</span></div>
      </div>
    </section>

    <p class="error" id="error" hidden></p>
  </main>

  <script type="module">
    // Data older than this is shown as a warning (the poller runs every 5 minutes).
    const STALE_AFTER_MIN = 15;

    const el = {
      status: document.getElementById('status'),
      refresh: document.getElementById('refresh'),
      error: document.getElementById('error'),
      battery: document.getElementById('battery'),
      powerIn: document.getElementById('power-in'),
      powerOut: document.getElementById('power-out'),
      temperature: document.getElementById('temperature'),
    };

    function formatAge(minutes) {
      if (minutes < 1) return 'just now';
      if (minutes < 60) return `${minutes} min ago`;
      if (minutes < 24 * 60) return `${Math.round(minutes / 60)} h ago`;
      return `${Math.round(minutes / (24 * 60))} d ago`;
    }

    async function loadLatest() {
      el.refresh.disabled = true;
      el.error.hidden = true;
      try {
        const res = await fetch('/api/readings/latest');
        // A server error page is HTML, not JSON, so don't let parsing hide the real problem.
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error ?? `HTTP ${res.status}`);

        el.battery.textContent = body.batteryLevel ?? '–';
        el.powerIn.textContent = body.powerIn ?? '–';
        el.powerOut.textContent = body.powerOut ?? '–';
        el.temperature.textContent = body.temperature ?? '–';

        const ts = new Date(body.ts);
        const ageMin = Math.round((Date.now() - ts) / 60_000);
        el.status.textContent =
          `${body.deviceSn} · updated ${ts.toLocaleString()} (${formatAge(ageMin)})`;
        el.status.classList.toggle('stale', ageMin > STALE_AFTER_MIN);
      } catch (err) {
        el.error.textContent = `Could not load the latest reading: ${err.message}`;
        el.error.hidden = false;
      } finally {
        el.refresh.disabled = false;
      }
    }

    el.refresh.addEventListener('click', loadLatest);
    loadLatest();
  </script>
</body>
</html>
