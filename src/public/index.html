<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eco-board</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <header class="hero">
      <div class="hero-top">
        <div class="brand">
          <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="2.5" y="4.5" width="19" height="15" rx="3.5" />
              <path d="M6 12h3l2-4 2 7 2-3h2" />
              <circle cx="18" cy="12" r="1.25" />
            </svg>
          </div>
          <div>
            <h1 class="wordmark">eco-<span>board</span></h1>
            <p class="meta" id="status">Loading…</p>
            <p class="pill" id="flow" hidden>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path id="flow-icon" /></svg>
              <span id="flow-text"></span>
            </p>
          </div>
        </div>
        <div class="hero-actions">
          <span class="pill" id="connection" data-state="loading">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="2" />
              <path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4M19.1 4.9a10 10 0 0 1 0 14.2M4.9 19.1a10 10 0 0 1 0-14.2" />
            </svg>
            <span id="connection-text">Loading</span>
          </span>
          <button id="refresh" type="button">Refresh</button>
        </div>
      </div>
      <figure class="sparkline">
        <svg viewBox="0 0 480 60" preserveAspectRatio="none" role="img" id="sparkline"
             aria-label="Battery level, last 24 hours">
          <polyline id="sparkline-line" />
        </svg>
        <figcaption>Battery · last 24 hours</figcaption>
      </figure>
      <div class="hero-footer">
        <span id="poll-info"></span>
        <span id="device-sn"></span>
      </div>
    </header>

    <section class="cards">
      <div class="card">
        <div class="label">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="2" y="7" width="17" height="10" rx="2" />
            <path d="M22 11v2" />
          </svg>
          Battery
        </div>
        <div class="value">
          <span id="battery">–</span><span class="unit">%</span>
          <span class="low-label" id="battery-low" hidden>Low</span>
        </div>
        <div class="gauge" id="battery-gauge" role="meter" aria-label="Battery level"
             aria-valuemin="0" aria-valuemax="100">
          <div class="gauge-fill" id="battery-fill"></div>
        </div>
      </div>
      <div class="card">
        <div class="label">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z" />
          </svg>
          Power in
        </div>
        <div class="value"><span id="power-in">–</span><span class="unit">W</span></div>
      </div>
      <div class="card">
        <div class="label">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 2v5M15 2v5M6 7h12v4a6 6 0 0 1-12 0V7zM12 17v5" />
          </svg>
          Power out
        </div>
        <div class="value"><span id="power-out">–</span><span class="unit">W</span></div>
      </div>
      <div class="card">
        <div class="label">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M14 14.76V4a2 2 0 0 0-4 0v10.76a4 4 0 1 0 4 0z" />
          </svg>
          Temperature
        </div>
        <div class="value"><span id="temperature">–</span><span class="unit">°C</span></div>
      </div>
    </section>

    <p class="error" id="error" hidden></p>

    <section class="history">
      <div class="section-header">
        <h2>History</h2>
        <div class="ranges" role="group" aria-label="Time range">
          <button type="button" data-range="24h" aria-pressed="true">24 hours</button>
          <button type="button" data-range="7d" aria-pressed="false">7 days</button>
          <button type="button" data-range="30d" aria-pressed="false">30 days</button>
        </div>
      </div>
      <div class="charts">
        <div class="card">
          <h3>Battery level</h3>
          <div class="chart-box"><canvas id="chart-battery"></canvas></div>
        </div>
        <div class="card">
          <h3>Power</h3>
          <div class="chart-box"><canvas id="chart-power"></canvas></div>
        </div>
        <div class="card">
          <h3>Temperature</h3>
          <div class="chart-box"><canvas id="chart-temperature"></canvas></div>
        </div>
      </div>
    </section>
  </main>

  <!-- Served by our own server from node_modules (see src/server.js). -->
  <script src="/vendor/chart.js/chart.umd.min.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
